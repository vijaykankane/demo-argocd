apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-vijay
  namespace: vijay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: httpd:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-vijay
  namespace: vijay
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: nginx
